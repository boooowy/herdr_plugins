id = "boooowy.agent-quota"
name = "Agent Quota Meter"
version = "0.3.2"
min_herdr_version = "0.7.0"
description = "Show Claude Code / Codex rate-limit usage and per-pane context meters on agent sidebar rows."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/agent-quota-meter", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/agent-quota-meter", "event"]

[[events]]
on = "workspace.focused"
command = ["./bin/agent-quota-meter", "event"]

[[events]]
on = "pane.closed"
command = ["./bin/agent-quota-meter", "event"]

[[actions]]
id = "refresh"
title = "Quota: refresh now"
command = ["./bin/agent-quota-meter", "event", "--force"]

[[actions]]
id = "open-dashboard"
title = "Quota: open dashboard"
command = ["./bin/agent-quota-meter", "open-dashboard"]

[[panes]]
id = "dashboard"
title = "Agent Quota"
placement = "overlay"
command = ["./bin/agent-quota-meter", "dashboard"]
