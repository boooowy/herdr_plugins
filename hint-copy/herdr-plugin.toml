id = "kayakatu.hint-copy"
name = "Hint Copy"
version = "0.6.0"
min_herdr_version = "0.7.0"
description = "tmux-thumbs style hint copy: press a key, hit a hint label, and the URL/path/SHA/IP under it lands on your clipboard."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "copy"
title = "Hint Copy: pick and copy"
command = ["./bin/hint-copy", "action"]

[[actions]]
id = "copy-mode"
title = "Hint Copy: copy mode (scrollback)"
command = ["./bin/hint-copy", "action", "copy"]

[[panes]]
id = "hints"
# herdr requires a non-empty pane title; a box-drawing dash blends into the
# overlay's border so the composite looks like the untouched tab.
title = "─"
placement = "overlay"
command = ["./bin/hint-copy", "ui"]
